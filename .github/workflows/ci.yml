name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Set minimal permissions by default, override per job if needed
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/backend/pnpm-lock.yaml
      
      - name: Install backend dependencies
        working-directory: ./app/backend
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm run prisma:generate
      
      - name: Lint backend code
        working-directory: ./app/backend
        run: pnpm run lint
      
      - name: Build backend
        working-directory: ./app/backend
        run: pnpm run build

      - name: Typecheck test suites
        working-directory: ./app/backend
        run: pnpm run typecheck:tests
      
      # Spec #51: enforces the Tier_Partition — every backend test file must be
      # collected by exactly one tier. Before this gate existed, 4 files ran in
      # no tier at all and 10 ran in two. Needs no database, so it lives in the
      # cheapest job.
      - name: Verify test tier partition
        working-directory: ./app/backend
        run: pnpm run test:tiers:verify

      - name: Run unit tests
        working-directory: ./app/backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-for-ci
        run: pnpm run test:unit

  backend-heavy-tests:
    name: Backend Heavy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ------------------------------------------------------------------
    # Spec #51: BLOCKING. The Exclusion_Register entry for this tier is closed.
    #
    # It ran in no pipeline at all before Spec #51, and its first ever
    # measurement was 15 of 23 suites failing — which is why it was wired as an
    # Advisory_Step with an expiry rather than as a gate. Those suites have since
    # been triaged and the tier is green and repeatable, so the expiry has been
    # discharged: `continue-on-error` is gone and the job is listed in both deploy
    # jobs' `needs:`.
    #
    # The failures were fixture drift, not product defects. The dominant cause was
    # fixtures that predate Spec #40 and write no `standings` row, so services
    # scoped their work from an empty competition and did nothing. See
    # `.kiro/steering/testing-strategy.md` for the fixture rules.
    #
    # Do not reintroduce `continue-on-error` here. If this tier goes red, that is
    # the signal it exists to give.
    # ------------------------------------------------------------------

    # Spec #51: this tier previously ran in NO pipeline. The steering file
    # recorded that gap as "removed in July 2026"; the removal was never
    # completed, so suites collected only by jest.config.heavy.js had never run
    # in CI — including one whose assertion could never pass.
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: armouredsouls_heavy
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --shm-size=256mb
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: ./app/backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm run prisma:generate

      - name: Run database migrations
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_heavy?connection_limit=5
        run: pnpm exec prisma migrate deploy

      - name: Run heavy tests
        working-directory: ./app/backend
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_heavy?connection_limit=5
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm run test:heavy

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: armouredsouls_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --shm-size=256mb
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/backend/pnpm-lock.yaml
      
      - name: Install backend dependencies
        working-directory: ./app/backend
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm run prisma:generate
      
      - name: Run database migrations
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_test?connection_limit=5
        run: pnpm exec prisma migrate deploy

      # Spec #45: fail the build when the migration history and schema.prisma
      # disagree. Without this, editing schema.prisma without generating a
      # migration passes every check and fails only at deploy time.
      - name: Check for schema drift
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_test?connection_limit=5
        # The previous step applied every migration to the test database, so the
        # configured datasource now reflects the migration history. Diffing it
        # against schema.prisma flags any model change that lacks a migration.
        # (Prisma 7 dropped --shadow-database-url / --to-schema-datamodel.)
        run: |
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
      
      # Spec #51: this step carried `continue-on-error: true` from the era of
      # "Backlog #64 second wave". It is a Blocking_Gate again. Because a
      # `continue-on-error` STEP still lets its JOB report success, every
      # `needs: [backend-integration-tests]` entry was satisfied by a job that
      # ran 274 failing tests — the gate looked real and was not. Do not
      # reintroduce the flag; if a suite genuinely cannot run, exclude it in
      # jest.tiers.js with a reason and an expiry instead.
      - name: Run integration tests
        working-directory: ./app/backend
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_test?connection_limit=5
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
        run: pnpm run test:integration

  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write  # For PR comments if needed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      
      - name: Install frontend dependencies
        working-directory: ./app/frontend
        run: pnpm install --frozen-lockfile
      
      - name: Lint frontend code
        working-directory: ./app/frontend
        run: pnpm run lint
      
      - name: Build frontend
        working-directory: ./app/frontend
        run: pnpm run build

      - name: Run frontend unit tests
        working-directory: ./app/frontend
        timeout-minutes: 15
        run: pnpm run test:ci

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-unit-tests, frontend-tests]
    if: ${{ needs['backend-unit-tests'].result == 'success' && needs['frontend-tests'].result == 'success' }}

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: armouredsouls_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --shm-size=256mb
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            app/backend/pnpm-lock.yaml
            app/frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: ./app/backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm run prisma:generate

      - name: Run database migrations
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_e2e?connection_limit=20
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_e2e?connection_limit=20
        run: |
          # Type-check seed script before executing to catch schema mismatches early
          pnpm exec tsc --noEmit --project tsconfig.seed.json
          pnpm exec prisma db seed

      - name: Build backend
        working-directory: ./app/backend
        run: pnpm run build

      - name: Start backend server
        working-directory: ./app/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armouredsouls_e2e?connection_limit=20
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test
          PORT: 3001
          CORS_ORIGIN: http://localhost:4173
          SCHEDULER_ENABLED: false
          BCRYPT_SALT_ROUNDS: 4
          # The whole E2E suite arrives from 127.0.0.1, so the per-IP limiters
          # see one client where production sees many. The login limiter
          # defaults to 10 POSTs per 15 minutes and counts failed attempts,
          # which the suite exhausts: auth.setup, login.spec, the deliberate
          # invalid-credential tests, and every navigateToProtectedPage
          # fallback all draw on the same budget. Once spent it cannot recover
          # inside a ~5 minute run, so later logins get a 429, the UI renders
          # "Login failed", and waitForURL times out. The victim differed per
          # run, which read as flake. No E2E test asserts rate limiting; it is
          # covered by backend unit tests.
          RATE_LIMIT_MAX_REQUESTS: 5000
          LOGIN_RATE_LIMIT_MAX: 1000
        run: |
          node dist/index.js &
          echo "Waiting for backend to start..."
          backend_ready=false
          for i in $(seq 1 30); do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              backend_ready=true
              break
            fi
            sleep 1
          done
          if [ "$backend_ready" != "true" ]; then
            echo "Backend failed to become ready within 30 seconds"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: ./app/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./app/frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: pnpm run build

      - name: Install Playwright browsers
        working-directory: ./app/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./app/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: |
          pnpm exec vite preview --port 4173 &
          echo "Waiting for frontend preview server to start..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ > /dev/null 2>&1; then
              echo "Frontend preview server is ready"
              break
            fi
            sleep 1
          done
          pnpm exec playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-html-report
          path: app/frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-artifacts
          path: |
            app/frontend/test-results/
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write  # For security scanning results
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            app/backend/pnpm-lock.yaml
            app/frontend/pnpm-lock.yaml

      # pnpm audit reads pnpm-lock.yaml directly, so we skip lifecycle scripts
      # to avoid transient CDN timeouts from native-binary downloads
      # (e.g., onnxruntime-node via gitnexus → @huggingface/transformers).
      - name: Install backend dependencies
        working-directory: ./app/backend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install frontend dependencies
        working-directory: ./app/frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate audit report (backend)
        working-directory: ./app/backend
        run: pnpm audit --json > audit-report-backend.json || true

      - name: Generate audit report (frontend)
        working-directory: ./app/frontend
        run: pnpm audit --json > audit-report-frontend.json || true

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-audit-reports
          path: |
            app/backend/audit-report-backend.json
            app/frontend/audit-report-frontend.json

      - name: Check allowlist and audit backend
        working-directory: ./app/backend
        run: |
          # Run pnpm audit at high level — fail on high/critical vulnerabilities in production deps only
          # Dev dependencies are not deployed and don't affect the production attack surface
          # Known accepted vulnerabilities are documented in .security-audit-allowlist.json
          ALLOWLIST_FILE="../../.security-audit-allowlist.json"
          if [ -f "$ALLOWLIST_FILE" ]; then
            echo "Security audit allowlist found — reviewing accepted vulnerabilities"
            cat "$ALLOWLIST_FILE"
          fi
          
          # Run audit and filter out allowlisted advisories
          AUDIT_OUTPUT=$(pnpm audit --json --prod 2>/dev/null || true)
          
          if [ -f "$ALLOWLIST_FILE" ]; then
            # Extract allowlisted GHSA IDs
            ALLOWED_IDS=$(cat "$ALLOWLIST_FILE" | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              console.log(data.allowlist.map(e => e.id).join('\n'));
            ")
            
            # Check for non-allowlisted high/critical vulnerabilities
            UNALLOWED=$(echo "$AUDIT_OUTPUT" | node -e "
              const fs = require('fs');
              const input = fs.readFileSync('/dev/stdin', 'utf8');
              const audit = JSON.parse(input);
              const allowed = new Set(process.argv.slice(1));
              const vulns = audit.vulnerabilities || {};
              
              // Collect all direct advisory IDs for each package (recursive via resolution)
              function getAdvisoryIds(pkgName, visited = new Set()) {
                if (visited.has(pkgName)) return [];
                visited.add(pkgName);
                const info = vulns[pkgName];
                if (!info) return [];
                const ids = [];
                for (const v of (info.via || [])) {
                  if (typeof v === 'object' && v.url) {
                    ids.push(v.url.split('/').pop());
                  } else if (typeof v === 'string') {
                    ids.push(...getAdvisoryIds(v, visited));
                  }
                }
                return ids;
              }
              
              let found = false;
              for (const [name, info] of Object.entries(vulns)) {
                const severity = info.severity;
                if (severity !== 'high' && severity !== 'critical') continue;
                const advisoryIds = getAdvisoryIds(name);
                const allAllowed = advisoryIds.length > 0 && advisoryIds.every(id => allowed.has(id));
                if (!allAllowed) {
                  console.error('UNALLOWED: ' + name + ' (' + severity + ') — ' + advisoryIds.join(', '));
                  found = true;
                }
              }
              process.exit(found ? 1 : 0);
            " $ALLOWED_IDS)
            
            AUDIT_EXIT=$?
            if [ $AUDIT_EXIT -ne 0 ]; then
              echo "Security audit failed — unallowed high/critical vulnerabilities found"
              pnpm audit --prod
              exit 1
            else
              echo "Security audit passed — all high/critical vulnerabilities are allowlisted"
            fi
          else
            pnpm audit --prod
          fi

      - name: Check allowlist and audit frontend
        working-directory: ./app/frontend
        run: |
          # Production deps only — dev tooling (vitest, mermaid, eslint) excluded
          #
          # This step previously ran a bare `pnpm audit --prod`, which printed the
          # allowlist and then ignored it, and failed on ANY severity including
          # moderate. That made it stricter than the backend step in one direction
          # (moderates broke the build) and useless in the other (allowlisted
          # advisories still broke it). It now mirrors the backend logic exactly:
          # fail only on high/critical that are not allowlisted.
          #
          # KNOWN DEFECT, shared with the backend step above: the parser reads
          # `audit.vulnerabilities`, which is the npm v7+ shape. `pnpm audit --json`
          # emits the npm v6 envelope instead — `{ actions, advisories, muted,
          # metadata }` — so the loop iterates an empty object and this gate
          # currently cannot fail. See docs/architecture/PRD_SECURITY.md
          # "Audit gate parses the wrong envelope". Fixing it surfaces 9 pre-existing
          # high/critical backend advisories and is tracked separately rather than
          # bundled into Spec #46.
          ALLOWLIST_FILE="../../.security-audit-allowlist.json"
          if [ -f "$ALLOWLIST_FILE" ]; then
            echo "Security audit allowlist found — reviewing accepted vulnerabilities"
            cat "$ALLOWLIST_FILE"
          fi

          AUDIT_OUTPUT=$(pnpm audit --json --prod 2>/dev/null || true)

          if [ -f "$ALLOWLIST_FILE" ]; then
            ALLOWED_IDS=$(cat "$ALLOWLIST_FILE" | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              console.log(data.allowlist.map(e => e.id).join('\n'));
            ")

            UNALLOWED=$(echo "$AUDIT_OUTPUT" | node -e "
              const fs = require('fs');
              const input = fs.readFileSync('/dev/stdin', 'utf8');
              const audit = JSON.parse(input);
              const allowed = new Set(process.argv.slice(1));
              const vulns = audit.vulnerabilities || {};

              // Collect all direct advisory IDs for each package (recursive via resolution)
              function getAdvisoryIds(pkgName, visited = new Set()) {
                if (visited.has(pkgName)) return [];
                visited.add(pkgName);
                const info = vulns[pkgName];
                if (!info) return [];
                const ids = [];
                for (const v of (info.via || [])) {
                  if (typeof v === 'object' && v.url) {
                    ids.push(v.url.split('/').pop());
                  } else if (typeof v === 'string') {
                    ids.push(...getAdvisoryIds(v, visited));
                  }
                }
                return ids;
              }

              let found = false;
              for (const [name, info] of Object.entries(vulns)) {
                const severity = info.severity;
                if (severity !== 'high' && severity !== 'critical') continue;
                const advisoryIds = getAdvisoryIds(name);
                const allAllowed = advisoryIds.length > 0 && advisoryIds.every(id => allowed.has(id));
                if (!allAllowed) {
                  console.error('UNALLOWED: ' + name + ' (' + severity + ') — ' + advisoryIds.join(', '));
                  found = true;
                }
              }
              process.exit(found ? 1 : 0);
            " $ALLOWED_IDS)

            AUDIT_EXIT=$?
            if [ $AUDIT_EXIT -ne 0 ]; then
              echo "Security audit failed — unallowed high/critical vulnerabilities found"
              pnpm audit --prod
              exit 1
            else
              echo "Security audit passed — all high/critical vulnerabilities are allowlisted"
            fi
          else
            pnpm audit --prod
          fi

  # ---------------------------------------------------------------------------
  # Notify on failure — Discord alert when any blocking job fails
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Discord Failure Alert
    runs-on: ubuntu-latest
    # backend-heavy-tests is included now that it is blocking. While it carried
    # job-level `continue-on-error` it always reported success, so it could never
    # have satisfied `failure()` and its presence here would have been decorative.
    needs: [backend-unit-tests, backend-integration-tests, backend-heavy-tests, frontend-tests, e2e-tests]
    if: ${{ failure() }}

    steps:
      - name: Send Discord notification
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ACTOR="${GITHUB_ACTOR}"
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **CI failed** on \`${BRANCH}\` (pushed by ${ACTOR})\\n${RUN_URL}\"}" \
            "${{ secrets.MONITORING_DISCORD_WEBHOOK }}" || true
